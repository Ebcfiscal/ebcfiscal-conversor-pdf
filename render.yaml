services:
  - type: web
    name: ebcfiscal-conversor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Wix embeds the app from another domain. These two options allow
    # Streamlit's file uploader to work inside that iframe without a 403.
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --server.enableXsrfProtection false --server.enableCORS false
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER
        sync: false
      - key: SMTP_USE_SSL
        value: "false"
